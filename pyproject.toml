[project]
name = "custody"
version = "0.1.0"
description = "Prototype maritime GEOINT mission-planning decision engine: uncertainty-to-tasking, candidate collect planning, and auditable decision traces."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dash>=2.18",
    "dash-bootstrap-components>=1.6",
    "dash-deck>=0.0.1",
    "duckdb>=1.5",
    "h3>=4.0",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "numba>=0.60",
    "numba-cuda[cu13]>=0.30",
    "numpy>=2.4.3",
    "pandas>=2.2,<3",
    "pydeck>=0.9.0",
    "pyproj>=3.7",
    "python-dotenv>=1.0",
    "python-ulid>=3.0",
    "pyarrow>=16",
    "rasterio>=1.5",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "shapely>=2.0",
    "sgp4>=2.23",
    "streamlit>=1.55.0",
    "yolo",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "ultralytics>=8.4.39",
    "sarpy>=1.3.64",
    "anthropic>=0.96.0",
    "openai>=2.32.0",
]

[project.urls]
Repository = "https://github.com/bmetcalfe/custody"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv]
# Streamlit's published metadata caps pandas at <3, but it works fine at runtime
# with pandas 3.x.  Override the cap so uv can resolve without downgrading pandas.
override-dependencies = ["pandas>=3.0.1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
yolo = { git = "https://github.com/MultimediaTechLab/YOLO", rev = "main" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src", "src/app"]
# day0/ contains archived legacy patches that are not part of the active test suite
testpaths = ["tests"]
