[project]
name = "custody"
version = "0.1.0"
description = "Anomaly-aware target custody and collection-planning prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pydeck>=0.9.0",
    "sgp4>=2.23",
    "streamlit>=1.19.0",
]

[project.urls]
Repository = "https://github.com/bmetcalfe/custody"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src", "src/app"]
