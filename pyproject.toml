[project]
name = "custody"
version = "0.1.0"
description = "Anomaly-aware target custody and collection-planning prototype"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dash>=2.18",
    "dash-bootstrap-components>=1.6",
    "dash-deck>=0.0.1",
    "joblib>=1.4",
    "numpy>=2.4.3",
    "pandas>=2.2,<3",
    "pydeck>=0.9.0",
    "scikit-learn>=1.5",
    "sgp4>=2.23",
    "streamlit>=1.55.0",
]

[project.urls]
Repository = "https://github.com/bmetcalfe/custody"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv]
# Streamlit's published metadata caps pandas at <3, but it works fine at runtime
# with pandas 3.x.  Override the cap so uv can resolve without downgrading pandas.
override-dependencies = ["pandas>=3.0.1"]

[tool.pytest.ini_options]
pythonpath = ["src", "src/app"]
# day0/ contains archived legacy patches that are not part of the active test suite
testpaths = ["tests"]
